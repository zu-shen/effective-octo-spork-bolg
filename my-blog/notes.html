<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sun-bird · 随记</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ====== 导航栏 ====== -->
    <nav class="navbar">
        <a href="index.html" class="brand">sun-bird</a>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="about.html">关于我</a></li>
            <li><a href="topics.html">专题</a></li>
        </ul>
    </nav>

    <!-- ====== 随记内容 ====== -->
    <main class="page">
        <a href="topics.html" class="back-link">← 返回专题</a>
        
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div>
                <h1 class="section-title">随记</h1>
                <p class="section-desc">一些零散的想法，像风一样路过。</p>
            </div>
            <!-- 管理按钮（仅管理员可见） -->
            <div id="admin-controls" style="display: none;">
                <button onclick="showAddForm()" style="padding: 10px 24px; background: #3d2a1a; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-size: 0.9rem;">+ 添加随记</button>
                <button onclick="logout()" style="padding: 10px 18px; background: transparent; color: #8a7a6a; border: 1px solid #ddd; border-radius: 12px; cursor: pointer; font-size: 0.9rem; margin-left: 8px;">退出管理</button>
            </div>
        </div>

        <!-- 文章列表容器 -->
        <div id="post-list" class="post-list"></div>
    </main>

    <!-- ====== 添加表单（弹窗） ====== -->
    <div id="add-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 999;">
        <div style="background: #fff; padding: 40px 36px; border-radius: 24px; max-width: 520px; width: 90%; box-shadow: 0 24px 64px rgba(0,0,0,0.15);">
            <h2 style="margin-bottom: 20px; font-size: 1.5rem;">📝 添加新随记</h2>
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 500; margin-bottom: 4px; font-size: 0.9rem;">标题</label>
                <input id="new-title" type="text" style="width: 100%; padding: 12px 16px; border: 1.5px solid #e6ddd4; border-radius: 12px; font-size: 1rem;" placeholder="输入标题..." />
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-weight: 500; margin-bottom: 4px; font-size: 0.9rem;">日期 / 标签</label>
                <input id="new-date" type="text" style="width: 100%; padding: 12px 16px; border: 1.5px solid #e6ddd4; border-radius: 12px; font-size: 1rem;" placeholder="例如：2025-01-15" />
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 500; margin-bottom: 4px; font-size: 0.9rem;">内容</label>
                <textarea id="new-content" rows="4" style="width: 100%; padding: 12px 16px; border: 1.5px solid #e6ddd4; border-radius: 12px; font-size: 1rem; resize: vertical;" placeholder="写点东西..."></textarea>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button onclick="closeAddForm()" style="padding: 10px 24px; background: transparent; color: #8a7a6a; border: 1.5px solid #e6ddd4; border-radius: 12px; cursor: pointer;">取消</button>
                <button onclick="saveNewNote()" style="padding: 10px 28px; background: #3d2a1a; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-weight: 500;">发布</button>
            </div>
        </div>
    </div>

    <!-- ====== 页脚 ====== -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-copy">© 2026 <span class="brand-foot">sun-bird</span> · 用文字记录生活</div>
            <div class="footer-meta">
                <span>本网站由 <a href="#" target="_blank">sun-bird</a> 强力支持</span>
                <span>豫ICP备2021034826号-1</span>
				<a href="https://wap.miit.gov.cn/">工信部首页</a>
            </div>
            <div class="footer-meta">
                <span>📧 联系：<a href="mailto:sara@poetize.cn">sara@poetize.cn</a></span>
            </div>
            <div class="footer-disclaimer">
                本网站部分内容来源于网络，仅供大家学习与参考。
                本网站一切内容不代表本站立场，并不代表本站赞同其观点和对其真实性负责。

                本网站将立即给予删除。
            </div>
        </div>
    </footer>

    <script src="js/admin.js"></script>
    <script src="js/main.js"></script>

    <script>
        // ============================================
        // 随记页面专属逻辑
        // ============================================

        const STORAGE_KEY = 'sunbird_notes';

        // 初始化数据
        initStorage(STORAGE_KEY, getDefaultNotes());

        // 渲染列表
        function renderNotes() {
            const container = document.getElementById('post-list');
            const notes = getStorageData(STORAGE_KEY);
            const admin = isAdmin();

            if (notes.length === 0) {
                container.innerHTML = `<p style="color: #b0a094; text-align: center; padding: 40px 0;">还没有随记，写一篇吧 ✍️</p>`;
                return;
            }

            container.innerHTML = notes.map(note => `
                <div class="post-item" style="position: relative;">
                    ${admin ? `<button onclick="deleteNote('${STORAGE_KEY}', '${note.id}')" style="position: absolute; top: 12px; right: 16px; background: transparent; border: none; color: #cc9999; cursor: pointer; font-size: 1.1rem; opacity: 0.6; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.6">✕</button>` : ''}
                    <h4>${note.title}</h4>
                    <span class="meta">${note.date}</span>
                    <p>${note.content}</p>
                </div>
            `).join('');
        }

        // 显示添加表单
        function showAddForm() {
            if (!checkAuth()) return;
            document.getElementById('add-modal').style.display = 'flex';
            document.getElementById('new-title').value = '';
            document.getElementById('new-date').value = '';
            document.getElementById('new-content').value = '';
        }

        function closeAddForm() {
            document.getElementById('add-modal').style.display = 'none';
        }

        // 保存新随记
        function saveNewNote() {
            const title = document.getElementById('new-title').value.trim();
            const date = document.getElementById('new-date').value.trim();
            const content = document.getElementById('new-content').value.trim();

            if (!title || !date || !content) {
                alert('请完整填写标题、日期和内容');
                return;
            }

            const notes = getStorageData(STORAGE_KEY);
            notes.unshift({
                id: Date.now(),
                title: title,
                date: date,
                content: content
            });
            setStorageData(STORAGE_KEY, notes);
            closeAddForm();
            renderNotes();
        }

        // 删除（通用）
        function deleteNote(key, id) {
            if (!confirm('确定要删除这篇吗？')) return;
            let data = getStorageData(key);
            data = data.filter(item => item.id !== Number(id));
            setStorageData(key, data);
            renderNotes();
        }

        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            // 如果是管理员，显示管理按钮
            if (isAdmin()) {
                document.getElementById('admin-controls').style.display = 'block';
            }

            // 双击标题区域可唤起登录（方便你进入管理）
            const titleArea = document.querySelector('.section-title');
            if (titleArea) {
                titleArea.addEventListener('dblclick', function(e) {
                    if (!isAdmin()) {
                        checkAuth();
                        location.reload();
                    }
                });
            }

            renderNotes();
        });
    </script>
</body>
</html>
